#
# Pimarchy Theme Configuration - Ravenwood Theme
#
# Palette matches the live Omarchy Ravenwood tuning (colors.toml):
#   background #222822, foreground #e8d5b7, accent #4ade80, muted #7f897d
# After editing, re-run install.sh to apply changes.
#

# ============================================================================
# Fonts
# ============================================================================

# Font family installed by install_nerd_font (JetBrainsMono Nerd Font)
FONT_FAMILY="JetBrainsMono Nerd Font"
FONT_NAME="JetBrainsMono Nerd Font"
# Waybar UI text (sans) + icons (Nerd Font Propo). The default Nerd Font
# family is monospaced and gives the clock/workspace digits muddy spacing;
# Propo is the Nerd Fonts UI variant. Liberation Sans is fonts-liberation.
FONT_UI="Liberation Sans"
FONT_ICON="JetBrainsMono Nerd Font Propo"
# Terminal font size (pt); bar font size in px
FONT_SIZE=9
FONT_SIZE_PX=12

# ============================================================================
# Hyprland Look & Feel (matches live looknfeel)
# ============================================================================

GAPS_IN=5
GAPS_OUT=10
BORDER_SIZE=2
CORNER_RADIUS=0
# Active border: solid accent; inactive: live grey
BORDER_ACTIVE="rgb(4ade80)"
BORDER_INACTIVE="rgba(595959aa)"
# Window opacity (focus/unfocused); browsers get the live near-opaque pair
OPACITY_DEFAULT="0.985 0.96"
OPACITY_BROWSER="1.0 0.985"

# ============================================================================
# GTK Theme Settings
# ============================================================================

GTK_THEME="Adwaita-dark"
ICON_THEME="Yaru-sage"
CURSOR_THEME="Adwaita"
CURSOR_SIZE=24
DARK_THEME=1
COLOR_SCHEME="prefer-dark"

# ============================================================================
# Colors (Ravenwood - live Omarchy palette)
# ============================================================================

# Base colors
COLOR_BASE=#222822
COLOR_SURFACE=#2d3830
COLOR_OVERLAY=#4a5a4d

# Text colors
COLOR_TEXT=#e8d5b7
COLOR_SUBTEXT=#7f897d

# Accent colors
COLOR_PRIMARY=#4ade80
COLOR_WARNING=#fbbf24
COLOR_ERROR=#e67e80
COLOR_INFO=#22d3ee
COLOR_ORANGE=#e69875

# ============================================================================
# Waybar Colors
# ============================================================================

# Bar matches the live shell: opaque background, 26px height (BAR_HEIGHT)
BAR_BG_COLOR=#222822
BAR_FG_COLOR=#e8d5b7
BAR_BORDER_COLOR=#141814

MODULE_BG_COLOR=#222822
MODULE_HOVER_BG_COLOR=#2d3830

LAUNCHER_BG_COLOR=#222822
LAUNCHER_HOVER_BG_COLOR=#2d3830

CLOCK_BG_COLOR=#222822

POWER_BG_COLOR=#222822
POWER_HOVER_BG_COLOR=#2d3830

# Tray attention uses rgba() form — waybar's CSS parser rejects 8-digit hex alpha
TRAY_ATTENTION_RGBA="rgba(230,126,128,0.20)"

# Module-specific colors
COLOR_MEMORY=#4ade80
COLOR_VOLUME=#e8d5b7
COLOR_POWER=#e67e80
COLOR_DISCONNECTED=#7f897d
COLOR_MUTED=#7f897d

# Workspace colors
COLOR_ACTIVE=#4ade80
COLOR_INACTIVE=#7f897d

# Bar geometry
BAR_HEIGHT=26
BAR_SPACING=0

# ============================================================================
# Rofi Settings
# ============================================================================

ROFI_WIDTH=500
ROFI_PROMPT="Search..."
ROFI_IMAGE_SIZE=28
ROFI_BORDER_COLOR=#4ade80
ROFI_BG_COLOR=#222822eb
ROFI_FG_COLOR=#e8d5b7
ROFI_INPUT_BG_COLOR=#1f241f99
ROFI_INPUT_FOCUS_BORDER_COLOR=#4ade8066
ROFI_ENTRY_SELECTED_BG_COLOR=#4ade8026
ROFI_ENTRY_SELECTED_FG_COLOR=#4ade80

# ============================================================================
# Mako Settings
# ============================================================================

MAKO_WIDTH=350
MAKO_MAX_VISIBLE=3
MAKO_DEFAULT_TIMEOUT=5000
MAKO_BORDER_SIZE=2
MAKO_BORDER_RADIUS=0
MAKO_PADDING=12
MAKO_MARGIN=12
MAKO_ANCHOR=top-right
MAKO_BG_COLOR=#222822ee
MAKO_FG_COLOR=#e8d5b7
MAKO_BORDER_COLOR=#4ade80

