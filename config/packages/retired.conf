# Pimarchy retired files — removed by `pimarchy update` (Quattro upgrade).
#
# Each line is a path previously shipped by Pimarchy that is no longer part
# of the default set. On upgrade they are renamed to <path>.pimarchy-upgrade.bak
# and then removed. `~` expands to the user's home directory.
#
# Pre-Quattro leftovers (VS Code/OpenCode era and stale config locations):
~/.config/chromium-flags.conf
~/.config/opencode
~/.local/share/opencode
~/.config/Code
~/.config/VSCode
~/.local/share/code