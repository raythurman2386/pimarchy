#
# Pimarchy Module Manifest
# 
# This file defines all installable modules and their configuration files.
# Modules can be enabled/disabled by commenting/uncommenting lines.
#

# Format: module_name|config_file|target_path|description

# ============================================================================
# Core Components
# ============================================================================

hyprland|hypr/hyprland.lua.template|~/.config/hypr/hyprland.lua|Hyprland window manager configuration (Lua)
hyprland|hypr/bindings.lua.template|~/.config/hypr/bindings.lua|Hyprland keybinds (required by hyprland.lua)
hyprland|hypr/background.jpg|~/.config/hypr/background.jpg|Desktop wallpaper
hyprland|hypr/screenshot.sh|~/.config/hypr/screenshot.sh|Screenshot helper script

waybar|waybar/config.jsonc.template|~/.config/waybar/config.jsonc|Waybar configuration
waybar|waybar/style.css.template|~/.config/waybar/style.css|Waybar styling

rofi|rofi/config.rasi.template|~/.config/rofi/config.rasi|Rofi launcher configuration
rofi|rofi/theme.rasi.template|~/.config/rofi/theme.rasi|Rofi styling
rofi|rofi/power-menu.sh|~/.config/rofi/power-menu.sh|Power menu script

mako|mako/config.template|~/.config/mako/config|Mako notification configuration

# ============================================================================
# Theming Components
# ============================================================================

gtk|gtk/settings.ini.template|~/.config/gtk-3.0/settings.ini|GTK3 settings
gtk|gtk/gtkrc-2.0.template|~/.gtkrc-2.0|GTK2 settings
fontconfig|fontconfig/50-pimarchy.conf|~/.config/fontconfig/conf.d/50-pimarchy.conf|Font defaults (Liberation Sans UI, JetBrainsMono mono)

terminal|terminal/foot.ini.template|~/.config/foot/foot.ini|Foot terminal configuration

# ============================================================================
# Shell & Utilities
# ============================================================================

shell|shell/aliases.sh.template|~/.bashrc.pimarchy|Pimarchy shell aliases
starship|starship/starship.toml.template|~/.config/starship.toml|Starship prompt configuration

# Pimarchy helper scripts (installed to ~/.local/bin/)
scripts|../bin/pimarchy-update-available|~/.local/bin/pimarchy-update-available|Waybar update availability checker
scripts|../bin/pimarchy-update-available-reset|~/.local/bin/pimarchy-update-available-reset|Reset waybar update widget signal
scripts|../bin/pimarchy-keybindings|~/.local/bin/pimarchy-keybindings|Live keybindings viewer (Rofi dmenu)
scripts|../bin/pimarchy-agent|~/.local/bin/pimarchy-agent|Default coding agent launcher (pimarchy agent)
scripts|../bin/pimarchy-default-agent|~/.local/bin/pimarchy-default-agent|Default agent setter (pimarchy default agent)
scripts|../bin/pimarchy-install|~/.local/bin/pimarchy-install|Package module installer (pimarchy install <module>)
scripts|../bin/pimarchy-upgrade|~/.local/bin/pimarchy-upgrade|Safe upgrade applier (used by pimarchy update)

# ============================================================================
# App Theming
# ============================================================================

btop|btop/btop.conf|~/.config/btop/btop.conf|btop system monitor configuration
btop|btop/ravenwood.theme|~/.config/btop/themes/ravenwood.theme|btop Ravenwood colour theme

raven|raven/config.toml|~/.raven/config.toml|Raven AI coding agent configuration

chromium|chromium/chromium-flags.conf.template|/etc/chromium.d/pimarchy|Chromium native Wayland and dark mode flags
zed|zed/settings.json.template|~/.config/zed/settings.json|Zed editor configuration and theme

