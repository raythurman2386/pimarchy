name: Validate Scripts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Validate shell scripts
      run: |
        bash -n install.sh
        bash -n uninstall.sh
        bash -n validate.sh
        for lib in lib/*.sh; do bash -n "$lib"; done
        for script in bin/*; do bash -n "$script"; done
        for test in tests/*.sh; do bash -n "$test"; done
    
    - name: Check executable permissions
      run: |
        test -x install.sh || (echo "install.sh not executable" && exit 1)
        test -x uninstall.sh || (echo "uninstall.sh not executable" && exit 1)
        test -x validate.sh || (echo "validate.sh not executable" && exit 1)
    
    - name: Validate config files exist
      run: |
        test -f config/theme.conf || (echo "theme.conf missing" && exit 1)
        test -f config/modules.conf || (echo "modules.conf missing" && exit 1)
        test -f config/packages/core.list || (echo "core.list missing" && exit 1)
        test -f config/packages/dev.list || (echo "dev.list missing" && exit 1)
        test -f config/packages/office.list || (echo "office.list missing" && exit 1)
        test -f config/packages/retired.conf || (echo "retired.conf missing" && exit 1)
    
    - name: Check for template syntax errors
      run: |
        # Check that template files have matching variables in config files
        bash validate.sh
